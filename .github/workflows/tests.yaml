name: Tests
"on":
  pull_request: {}
  push:
    branches:
    - main
jobs:
  unit:
    name: Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version-file: .java-version
        distribution: temurin
    - uses: gradle/actions/wrapper-validation@v6.4.1
    - uses: gradle/actions/setup-gradle@v6.4.1
    - name: Build
      run: ./gradlew build
    - uses: codecov/codecov-action@v7
      with:
        use_oidc: true
